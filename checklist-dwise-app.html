<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#12172b" />
<title>Checklist Digital D WISE</title>
<style>
:root{
  --blue:#1565ff; --green:#16a34a; --yellow:#eab308; --orange:#f97316;
  --red:#ef4444; --purple:#8b5cf6; --dark:#12172b; --ink:#1b2033;
  --muted:#6b7280; --bg:#f2f4f9; --card:#ffffff; --danger:#dc2626;
  --radius:18px; --shadow:0 6px 18px rgba(20,25,50,.08);
  font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;background:var(--bg);color:var(--ink)}
body{-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
.app-shell{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;padding-bottom:96px}
.app-header{background:var(--dark);color:#fff;padding:14px 16px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;border-radius:0 0 20px 20px}
.app-header__left{display:flex;align-items:center;gap:8px}
.btn-back{background:rgba(255,255,255,.12);border:none;color:#fff;font-size:20px;border-radius:50%;width:36px;height:36px;flex:none;cursor:pointer}
.app-header__logo{font-weight:800;font-size:16px;letter-spacing:1px;white-space:nowrap}
.app-header__logo-d{color:#ffd400}
.brand-badge{background:#fff;border-radius:10px;padding:4px 9px;display:inline-flex;align-items:center;line-height:0}
.brand-badge img{height:24px;display:block}
.login-logo-img{height:64px;display:block;margin:0 auto 6px}
.app-header__title{flex:1;text-align:right}
.app-header__title h1{margin:0;font-size:15px;font-weight:700}
.app-header__title p{margin:2px 0 0;font-size:12px;opacity:.75}
.app-main{padding:14px 14px 24px;flex:1}
.screen{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card--missing{border:2px solid var(--red);background:#fff5f5}
.card--info{border:2px solid var(--blue);background:#f2f6ff}
.btn{border:none;border-radius:14px;padding:13px 18px;font-weight:700;font-size:15px;cursor:pointer}
.btn:active{transform:scale(.98)}
.btn--primary{background:var(--blue);color:#fff}
.btn--dark{background:var(--dark);color:#fff}
.btn--send{background:var(--green);color:#fff}
.btn--disabled{background:#d1d5db;color:#6b7280}
.btn--ghost{background:#eef1f8;color:var(--ink)}
.btn--full{width:100%}
a.btn{display:block;text-align:center;text-decoration:none;box-sizing:border-box}
.btn--big{padding:16px;font-size:16px}
.btn--small{padding:8px 12px;font-size:12.5px}
.sticky-cta{position:fixed;bottom:14px;left:14px;right:14px;max-width:532px;margin:0 auto;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.btn-link{background:none;border:none;color:var(--blue);font-size:12.5px;text-decoration:underline;cursor:pointer;padding:4px 0}
.btn-link--danger{color:var(--danger)}
.hidden-input{display:none}
.screen--login{align-items:center;text-align:center;padding-top:18px}
.login-logo{font-size:34px;color:var(--dark);letter-spacing:1px;font-weight:900}
.login-logo__d{color:var(--blue)}
.login-app-name{font-weight:800;font-size:15px;margin-top:4px}
.login-app-sub{color:var(--muted);font-size:12.5px;margin-bottom:6px}
.login-card{width:100%;text-align:left}
.login-card__title{font-weight:800;color:var(--blue);margin-bottom:12px;font-size:13px;letter-spacing:.5px}
.field-label{display:block;font-weight:700;font-size:13px;margin:12px 0 6px}
.required-dot{color:var(--red)}
.text-input,.rotina-textarea{width:100%;padding:12px;border-radius:12px;border:1.5px solid #dfe3ee;font-size:15px;font-family:inherit}
.field-error{color:var(--danger);font-size:12px;margin:4px 0 0}
.turno-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.turno-btn{padding:14px 0;border-radius:12px;border:2px solid #dfe3ee;background:#fff;font-weight:800;font-size:14px;cursor:pointer}
.turno-btn--active{background:var(--blue);border-color:var(--blue);color:#fff}
.login-auto-row{display:flex;gap:10px;margin:14px 0}
.login-auto-item{flex:1;background:#f5f7fc;border-radius:12px;padding:10px;text-align:center}
.login-auto-item span{display:block;font-size:11px;color:var(--muted)}
.login-auto-item strong{font-size:15px}
.menu-summary__row{display:flex;justify-content:space-between;margin-bottom:10px}
.menu-summary__label{font-size:11px;color:var(--muted)}
.menu-summary__value{font-weight:800;font-size:15px}
.menu-summary__progress span{display:block;font-size:12px;color:var(--muted);margin-top:6px}
.menu-summary__id{font-size:11px;color:var(--muted);margin-top:8px}
.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.area-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;text-align:left;border:none;cursor:pointer;display:flex;flex-direction:column;gap:8px;width:100%}
.area-card--done{border:2px solid var(--green)}
.area-card--pending{border:2px solid transparent}
.area-card__top{display:flex;justify-content:space-between;align-items:center}
.area-card__emoji{font-size:26px}
.badge{font-size:10px;font-weight:800;padding:3px 7px;border-radius:20px}
.badge--done{background:#dcfce7;color:#15803d}
.badge--pending{background:#fee2e2;color:#b91c1c}
.area-card__title{font-weight:800;font-size:13.5px;line-height:1.25}
.area-card__subtitle{font-size:11px;color:var(--muted);margin-top:-6px}
.area-card__count{display:block;font-size:10.5px;color:var(--muted);margin-top:4px}
.progress-bar{background:#e7eaf3;border-radius:20px;height:8px;overflow:hidden}
.progress-bar__fill{height:100%;background:var(--blue);border-radius:20px;transition:width .25s ease}
.progress-bar__fill--complete{background:var(--green)}
.machine-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.machine-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 10px;text-align:center;cursor:pointer;border:2px solid transparent;width:100%}
.machine-card--done{border-color:var(--green)}
.machine-card__name{font-weight:800;font-size:14px}
.machine-card__count{font-size:12px;color:var(--muted);margin:6px 0}
.machine-card__status{font-size:11.5px;font-weight:700}
.machine-summary{background:#fee2e2;color:#b91c1c;border-radius:14px;padding:12px 14px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.machine-summary--done{background:#dcfce7;color:#15803d}
.photo-item{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-bottom:1px solid #eef0f6}
.photo-item:last-child{border-bottom:none}
.photo-item__label-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.photo-item__label{font-weight:800;font-size:13.5px}
.tag{font-size:9.5px;font-weight:800;border-radius:20px;padding:2px 8px;text-transform:uppercase}
.tag--required{background:#fee2e2;color:#b91c1c}
.tag--optional{background:#e0e7ff;color:#3730a3}
.photo-item__hint{font-size:12px;color:var(--muted);margin:0}
.photo-item__error{color:var(--danger);font-size:12px;margin:0}
.number-field-row{display:flex;align-items:center;gap:10px}
.number-field-row input.text-input{max-width:160px}
.number-field-row .number-unit{font-weight:800;font-size:13px;color:var(--muted)}
.thumb-wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.thumb{width:64px;height:64px;object-fit:cover;border-radius:12px;border:1px solid #e5e8f0}
.thumb--small{width:44px;height:44px}
.thumb--pdf{display:flex;align-items:center;justify-content:center;background:#eef1f8;font-size:11px;font-weight:700;color:var(--ink)}
.thumb-status{font-size:11.5px;font-weight:700;color:#15803d;width:100%}
.conferencia-title{font-weight:800;font-size:15px;margin-bottom:10px}
.conferencia-percent{font-weight:800;margin:8px 0 12px;font-size:14px}
.conferencia-list{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12.5px}
.conferencia-meta{margin-top:14px;padding-top:12px;border-top:1px solid #eef0f6;font-size:12.5px;display:grid;gap:4px;color:var(--muted)}
.conferencia-missing-title{font-weight:800;color:var(--danger);margin-bottom:8px}
.missing-list{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.missing-item{width:100%;text-align:left;background:#fff;border:1px solid #fecaca;border-radius:10px;padding:8px 10px;font-size:12.5px;color:#991b1b;cursor:pointer}
.rotina-attachments{margin-top:14px}
.rotina-attachments__list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.rotina-attachment{display:flex;align-items:center;gap:8px;background:#f5f7fc;border-radius:10px;padding:6px 8px}
.rotina-attachment__name{flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.screen--success{align-items:center;text-align:center;padding-top:40px;gap:16px}
.success-emoji{font-size:56px}
.screen--success h1{margin:0;font-size:20px}
.success-id{font-weight:800;color:var(--blue);font-size:14px}
.success-actions{width:100%;display:flex;flex-direction:column;gap:10px}
.screen--loading{min-height:100vh;display:flex;align-items:center;justify-content:center}
.settings-toggle{background:none;border:none;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;margin-top:6px}
.note-box{font-size:12px;color:var(--muted);background:#f5f7fc;border-radius:10px;padding:10px}
.routine-check{padding:12px 0;border-bottom:1px solid #eef0f6}
.routine-check:last-child{border-bottom:none}
.routine-check--missing{background:#fff5f5;margin:0 -16px;padding:12px 16px;border-radius:10px}
.routine-check__top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.routine-check__label{font-weight:800;font-size:13.5px}
.routine-check__meta{font-size:11.5px;color:var(--muted);margin:4px 0 8px}
.routine-check__buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn-toggle{border:2px solid #dfe3ee;background:#fff;border-radius:10px;padding:10px 6px;font-weight:700;font-size:12.5px;cursor:pointer}
.btn-toggle--yes.btn-toggle--active{background:#dcfce7;border-color:#16a34a;color:#15803d}
.btn-toggle--no.btn-toggle--active{background:#fee2e2;border-color:#dc2626;color:#b91c1c}
</style>
</head>
<body>
<div id="app"></div>

   e-mail do gerente"), mas esse ajuste vale apenas para a sessão atual.

/* ---------- chaves de entrada ---------- */
function machineEntryKey(areaId, machine, subKey){ return areaId+"::"+machine+"::"+subKey; }
function itemEntryKey(areaId, itemKey){ return areaId+"::"+itemKey; }
function textEntryKey(areaId, textKey){ return areaId+"::"+textKey; }
function rotinaCheckKey(areaId, itemKey){ return areaId+"::check::"+itemKey; }
function sanitizeId(str){ return str.replace(/[^a-zA-Z0-9]/g,"-"); }

/* ---------- progresso ---------- */
function machineProgress(area, machine, entries){
  const required = area.subItems.filter(s=>s.required);
  const optional = area.subItems.filter(s=>!s.required);
  const requiredDone = required.filter(s=>!!entries[machineEntryKey(area.id,machine,s.key)]).length;
  const optionalDone = optional.filter(s=>!!entries[machineEntryKey(area.id,machine,s.key)]).length;
  return { requiredTotal:required.length, requiredDone, optionalTotal:optional.length, optionalDone, complete:requiredDone===required.length };
}
function areaProgress(area, entries){
  if(area.kind==="machines"){
    const total=area.machines.length;
    const done=area.machines.filter(m=>machineProgress(area,m,entries).complete).length;
    return {done,total,percent: total? Math.round(done/total*100):100};
  }
  if(area.kind==="items"){
    const required=area.items.filter(i=>i.required);
    const done=required.filter(i=>!!entries[itemEntryKey(area.id,i.key)]).length;
    return {done,total:required.length,percent: required.length? Math.round(done/required.length*100):100};
  }
  if(area.kind==="text"){
    const filled=!!(entries[textEntryKey(area.id,area.textKey)]||"").trim();
    const checklist=area.checklistItems||[];
    const checklistDone=checklist.filter(i=>!!entries[rotinaCheckKey(area.id,i.key)]).length;
    return {done:(filled?1:0)+checklistDone, total:1+checklist.length, percent: (1+checklist.length)? Math.round(((filled?1:0)+checklistDone)/(1+checklist.length)*100):100};
  }
  return {done:0,total:0,percent:100};
}
function areaComplete(area,entries){ const p=areaProgress(area,entries); return p.total===0?true:p.done>=p.total; }
function collectMissing(areas,entries){
  const missing=[];
  for(const area of areas){
    if(area.kind==="machines"){
      const machineLabel=area.machineLabel||"MÁQUINA";
      for(const machine of area.machines){
        for(const sub of area.subItems){
          if(!sub.required) continue;
          if(!entries[machineEntryKey(area.id,machine,sub.key)]){
            missing.push({areaId:area.id,areaTitle:area.title,label:`${machineLabel} ${machine} — ${sub.label}`});
          }
        }
      }
    } else if(area.kind==="items"){
      for(const item of area.items){
        if(!item.required) continue;
        if(!entries[itemEntryKey(area.id,item.key)]) missing.push({areaId:area.id,areaTitle:area.title,label:item.label});
      }
    } else if(area.kind==="text"){
      const filled=!!(entries[textEntryKey(area.id,area.textKey)]||"").trim();
      if(area.required && !filled) missing.push({areaId:area.id,areaTitle:area.title,label:area.textLabel});
      for(const item of area.checklistItems||[]){
        if(!entries[rotinaCheckKey(area.id,item.key)]) missing.push({areaId:area.id,areaTitle:area.title,label:item.label+" (marcar Realizado/Não realizado)"});
      }
    }
  }
  return missing;
}
function overallProgress(areas,entries){
  let done=0,total=0;
  for(const area of areas){ const p=areaProgress(area,entries); done+=p.done; total+=p.total; }
  return {done,total,percent: total? Math.round(done/total*100):100};
}

/* ---------- utilidades de data/id ---------- */
function pad(n){ return String(n).padStart(2,"0"); }
function formatDateBR(d){ return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`; }
function formatTimeBR(d){ return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function generateChecklistId(turno){
  const now=new Date();
  const stamp=`${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
  const rand=Math.random().toString(36).slice(2,6).toUpperCase();
  return `DWISE-${turno||"X"}-${stamp}-${rand}`;
}

/* ============================================================================
   RASCUNHO LOCAL (IndexedDB) — se o celular fechar o navegador ou recarregar
   no meio do turno, as fotos e respostas já preenchidas não se perdem: ficam
   salvas neste mesmo aparelho até o checklist ser enviado ou um novo ser
   iniciado. "Melhor esforço": se o navegador não suportar, o app funciona
   normalmente, só sem essa recuperação automática.
============================================================================ */
const DRAFT_DB_NAME = "dwise-checklist";
const DRAFT_STORE_NAME = "draft";
const DRAFT_KEY = "current-draft";

function openDraftDb(){
  return new Promise((resolve,reject)=>{
    if(!("indexedDB" in window)){ reject(new Error("IndexedDB não suportado")); return; }
    const req = indexedDB.open(DRAFT_DB_NAME, 1);
    req.onupgradeneeded = ()=> req.result.createObjectStore(DRAFT_STORE_NAME);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function saveDraftToDb(data){
  try{
    const db = await openDraftDb();
    await new Promise((resolve,reject)=>{
      const tx = db.transaction(DRAFT_STORE_NAME,"readwrite");
      tx.objectStore(DRAFT_STORE_NAME).put(data, DRAFT_KEY);
      tx.oncomplete = resolve;
      tx.onerror = ()=> reject(tx.error);
    });
    db.close();
  }catch(e){ console.warn("Não foi possível salvar rascunho local:", e); }
}
async function loadDraftFromDb(){
  try{
    const db = await openDraftDb();
    const result = await new Promise((resolve,reject)=>{
      const tx = db.transaction(DRAFT_STORE_NAME,"readonly");
      const req = tx.objectStore(DRAFT_STORE_NAME).get(DRAFT_KEY);
      req.onsuccess = ()=> resolve(req.result||null);
      req.onerror = ()=> reject(req.error);
    });
    db.close();
    return result;
  }catch(e){ console.warn("Não foi possível carregar rascunho local:", e); return null; }
}
async function clearDraftInDb(){
  try{
    const db = await openDraftDb();
    await new Promise((resolve,reject)=>{
      const tx = db.transaction(DRAFT_STORE_NAME,"readwrite");
      tx.objectStore(DRAFT_STORE_NAME).delete(DRAFT_KEY);
      tx.oncomplete = resolve;
      tx.onerror = ()=> reject(tx.error);
    });
    db.close();
  }catch(e){ console.warn("Não foi possível limpar rascunho local:", e); }
}

let draftSaveTimer = null;
function scheduleAutosave(){
  if(!state.checklistId) return; // só salva depois que o checklist foi iniciado (botão "INICIAR CHECKLIST")
  if(draftSaveTimer) clearTimeout(draftSaveTimer);
  draftSaveTimer = setTimeout(()=>{
    saveDraftToDb({
      supervisor: state.supervisor,
      checklistId: state.checklistId,
      startedAt: state.startedAt,
      entries: state.entries,
    });
  }, 400);
}

/* ---------- compressão de imagem ---------- */
const MAX_FULL_WIDTH=1440, MAX_THUMB_WIDTH=260, JPEG_QUALITY=0.72;
function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}
function loadImage(dataUrl){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>resolve(img);
    img.onerror=reject;
    img.src=dataUrl;
  });
}
function resizeToDataUrl(img,maxWidth,quality){
  const scale=Math.min(1,maxWidth/img.width);
  const w=Math.max(1,Math.round(img.width*scale));
  const h=Math.max(1,Math.round(img.height*scale));
  const canvas=document.createElement("canvas");
  canvas.width=w; canvas.height=h;
  canvas.getContext("2d").drawImage(img,0,0,w,h);
  return canvas.toDataURL("image/jpeg",quality);
}
async function processPhotoFile(file){
  const originalDataUrl=await fileToDataUrl(file);
  const img=await loadImage(originalDataUrl);
  const full=resizeToDataUrl(img,MAX_FULL_WIDTH,JPEG_QUALITY);
  const thumb=resizeToDataUrl(img,MAX_THUMB_WIDTH,0.6);
  return {kind:"photo",fileName:file.name||"foto.jpg",mimeType:"image/jpeg",full,thumb};
}
async function processAttachmentFile(file){
  const isImage=file.type && file.type.startsWith("image/");
  if(isImage){ const p=await processPhotoFile(file); return {...p,kind:"attachment",mimeType:"image/jpeg"}; }
  const dataUrl=await fileToDataUrl(file);
  return {kind:"attachment",fileName:file.name||"arquivo",mimeType:file.type||"application/octet-stream",full:dataUrl,thumb:null};
}

/* ---------- helpers ---------- */
function escapeHtml(str){
  return String(str==null?"":str).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function findArea(areaId){ return AREAS.find(a=>a.id===areaId) || null; }

function renderPhotoButton(key, label, hint, required, kind, accept, entry){
  const inputId = "input-"+sanitizeId(key);
  const isPhoto = kind!=="attachment";
  const acceptAttr = accept || (isPhoto ? "image/*" : "image/*,.pdf,application/pdf");
  // Campos de FOTO forçam a abertura direta da câmera no celular/tablet
  // (o usuário precisa tirar a foto na hora — não pode escolher da galeria).
  // Anexos (ex.: checklist preventivo já escaneado) continuam permitindo
  // escolher um arquivo existente, inclusive PDF.
  const captureAttr = isPhoto ? ` capture="environment"` : "";
  const filled = !!entry;
  const isPdf = filled && entry.mimeType==="application/pdf";
  const inputHtml = `<input id="${inputId}" type="file" accept="${acceptAttr}"${captureAttr} class="hidden-input photo-input" data-key="${key}" data-kind="${kind}" />`;

  let actionHtml;
  if(filled){
    const retakeLabel = isPhoto ? "🔄 TIRAR FOTO NOVAMENTE" : "🔄 TROCAR ARQUIVO";
    actionHtml = `
      <div class="thumb-wrap">
        ${isPdf? `<div class="thumb thumb--pdf">📄 PDF</div>` : `<img class="thumb" src="${entry.thumb||entry.full}" alt="${escapeHtml(label)}" />`}
        <div class="thumb-status">✅ Concluído</div>
        <button type="button" class="btn btn--ghost btn--small" data-action="trigger-file" data-target="${inputId}">${retakeLabel}</button>
        <button type="button" class="btn-link btn-link--danger" data-action="remove-entry" data-key="${key}">remover</button>
      </div>
      ${inputHtml}`;
  } else {
    const addLabel = isPhoto ? "📷 TIRAR FOTO" : "📎 ADICIONAR ARQUIVO";
    actionHtml = `
      <button type="button" class="btn btn--primary" data-action="trigger-file" data-target="${inputId}">${addLabel}</button>
      ${inputHtml}`;
  }

  return `
  <div class="photo-item ${filled?"photo-item--done":"photo-item--pending"}">
    <div class="photo-item__info">
      <div class="photo-item__label-row">
        <span class="photo-item__label">${escapeHtml(label)}</span>
        ${required? `<span class="tag tag--required">obrigatória</span>` : `<span class="tag tag--optional">opcional</span>`}
      </div>
      ${hint? `<p class="photo-item__hint">${escapeHtml(hint)}</p>`:""}
    </div>
    <div class="photo-item__action">${actionHtml}</div>
  </div>`;
}

// Unidade genérica usada nos contadores ("X/Y fotos" ou "X/Y itens") — só
// diz "fotos" quando TODOS os subitens da área são realmente foto/anexo;
// se a área tiver algum campo numérico (ex.: produção), usa "itens".
function subItemsCountUnit(area){
  return (area.subItems||[]).some(s=>s.type==="number") ? "itens" : "fotos";
}

function renderNumberField(key, label, hint, required, unit, rawValue){
  const inputId = "input-"+sanitizeId(key);
  const filled = rawValue!=null && String(rawValue).trim()!=="";
  return `
  <div class="photo-item ${filled?"photo-item--done":"photo-item--pending"}">
    <div class="photo-item__info">
      <div class="photo-item__label-row">
        <span class="photo-item__label">${escapeHtml(label)}</span>
        ${required? `<span class="tag tag--required">obrigatória</span>` : `<span class="tag tag--optional">opcional</span>`}
      </div>
      ${hint? `<p class="photo-item__hint">${escapeHtml(hint)}</p>`:""}
    </div>
    <div class="photo-item__action">
      <div class="number-field-row">
        <input id="${inputId}" type="number" inputmode="decimal" min="0" step="0.01" class="text-input number-field" data-key="${key}" value="${filled?escapeHtml(String(rawValue)):""}" placeholder="0" />
        ${unit? `<span class="number-unit">${escapeHtml(unit)}</span>`:""}
      </div>
    </div>
  </div>`;
}

function renderMachineGrid(area){
  const label = area.machineLabel || "MÁQUINA";
  const unit = subItemsCountUnit(area);
  const cards = area.machines.map(machine=>{
    const p = machineProgress(area, machine, state.entries);
    return `
    <button type="button" class="machine-card ${p.complete?"machine-card--done":""}" data-action="open-machine" data-machine="${escapeHtml(machine)}">
      <div class="machine-card__name">${label} ${escapeHtml(machine)}</div>
      <div class="machine-card__count">${p.requiredDone}/${p.requiredTotal} ${unit}</div>
      <div class="machine-card__status">${p.complete? "✅ CONCLUÍDA" : "🔴 PENDENTE"}</div>
    </button>`;
  }).join("");
  return `<div class="screen screen--machine-grid"><div class="machine-grid">${cards}</div></div>`;
}

function renderMachineDetail(area, machine){
  const items = area.subItems.map((sub,idx)=>{
    const key = machineEntryKey(area.id, machine, sub.key);
    if(sub.type==="number"){
      return renderNumberField(key, `${idx+1}. ${sub.label}`, sub.hint, sub.required, sub.unit, state.entries[key]);
    }
    return renderPhotoButton(key, `${idx+1}. ${sub.label}`, sub.hint, sub.required, sub.type, sub.accept, state.entries[key]);
  }).join("");
  const p = machineProgress(area, machine, state.entries);
  const label = area.machineLabel || "MÁQUINA";
  const unit = subItemsCountUnit(area).toUpperCase();
  return `
  <div class="screen screen--machine-detail">
    <div class="card">${items}</div>
    <div class="machine-summary ${p.complete?"machine-summary--done":""}">

/* ============================================================================
   ENVIO AUTOMÁTICO — conversa com o backend (server/) que efetivamente
   dispara o e-mail com as fotos anexadas via SMTP. Sem esse servidor
   rodando e acessível, não existe forma de um HTML puro enviar e-mail de
   verdade (navegadores não falam SMTP) — por isso sempre há o fallback
   manual (baixar relatório + mailto) logo abaixo.
============================================================================ */
function buildSubmissionPayload(){
  const areasPayload = AREAS.map(area=>{
    if(area.kind==="machines"){
      const machineLabel = area.machineLabel || "MÁQUINA";
      const numberSub = area.subItems.find(sub=>sub.type==="number");
      const machines = area.machines.map(machine=>{
        const photos = area.subItems.filter(sub=>sub.type!=="number").map(sub=>{
          const entry = state.entries[machineEntryKey(area.id, machine, sub.key)];
          if(!entry) return null;
          return {label:sub.label, fileName:entry.fileName, mimeType:entry.mimeType, dataUrl:entry.full};
        }).filter(Boolean);
        const result = {machine:`${machineLabel} ${machine}`, photos};
        if(numberSub){
          const raw = state.entries[machineEntryKey(area.id, machine, numberSub.key)];
          const num = raw!=null && String(raw).trim()!=="" ? Number(raw) : null;
          result.production = {label:numberSub.label, unit:numberSub.unit||"", value: (num!=null && !isNaN(num)) ? num : null};
        }
        return result;
      });
      return {id:area.id, title:area.title, kind:area.kind, colorHint:area.color, machines};
    }
    if(area.kind==="items"){
      const photos = area.items.map(item=>{
        const entry = state.entries[itemEntryKey(area.id, item.key)];
        if(!entry) return null;
        return {label:item.label, fileName:entry.fileName, mimeType:entry.mimeType, dataUrl:entry.full};
      }).filter(Boolean);
      return {id:area.id, title:area.title, kind:area.kind, colorHint:area.color, photos};
    }
    if(area.kind==="text"){
      const texto = state.entries[textEntryKey(area.id, area.textKey)] || "";
      const anexosRaw = state.entries[textEntryKey(area.id, area.attachmentKey)] || [];
      const anexos = anexosRaw.map(a=>({fileName:a.fileName, mimeType:a.mimeType, dataUrl:a.full}));
      const checklist = (area.checklistItems||[]).map(item=>({
        key:item.key, label:item.label, como:item.como, local:item.local, tempo:item.tempo, freq:item.freq,
        done: state.entries[rotinaCheckKey(area.id,item.key)]==='sim',
        answered: !!state.entries[rotinaCheckKey(area.id,item.key)],
      }));
      return {id:area.id, title:area.title, kind:area.kind, colorHint:area.color, texto, anexos, checklist};
    }
    return {id:area.id, title:area.title, kind:area.kind};
  });

  return {
    checklistId: state.checklistId,
    supervisor: {nome:state.supervisor.nome, turno:state.supervisor.turno},
    data: state.startedAt && state.startedAt.data,
    hora: state.startedAt && state.startedAt.hora,
    areas: areasPayload,
  };
}

async function submitToServer(payload){
  const controller = new AbortController();
  const timeout = setTimeout(()=>controller.abort(), 20000);
  let res;
  try{
    res = await fetch(`${state.apiBaseUrl}/api/checklist/submit`, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify(payload),
      signal: controller.signal,
    });
  }catch(err){
    if(err.name==="AbortError"){
      throw new Error("O servidor demorou demais para responder (tempo esgotado).");
    }
    throw new Error(`Não foi possível conectar ao servidor em ${state.apiBaseUrl}. Verifique se ele está rodando e acessível pelo celular.`);
  }finally{
    clearTimeout(timeout);
  }
  if(!res.ok){
    let message = "O servidor recusou o envio.";
    try{ const data = await res.json(); if(data && data.error) message = data.error; }catch(e){ /* ignore */ }
    throw new Error(message);
  }
  return res.json();
}

async function doSubmit(){
  if(state.sending) return;
  state.sending = true;
  state.sendResult = null;
  state.sendError = null;
  render();
  try{
    const payload = buildSubmissionPayload();
    const result = await submitToServer(payload);
    // O checklist já foi salvo e já está visível no painel/relatório para
    // todo mundo (é isso que "sent" e "sent_no_email" têm em comum). A
    // única diferença entre os dois é se o e-mail automático também saiu.
    state.sendResult = result && result.emailSent ? "sent" : "sent_no_email";
    state.sendError = (result && result.emailError) || null;
    await clearDraftInDb(); // salvo com sucesso: não precisa mais recuperar rascunho
  }catch(err){
    // Chega aqui só quando o checklist NÃO foi salvo de verdade (sem
    // internet, servidor fora do ar, ou falha ao gravar no histórico) — aí
    // sim ele ainda não apareceu no painel nem no relatório.
    console.error(err);
    state.sendResult = "failed";
    state.sendError = err.message || "Falha ao enviar o checklist.";
  }finally{
    state.sending = false;
    state.screen = "success";
    render();
  }
}

function buildReportHtml(){
  const COLORS = {blue:"#1565ff",green:"#16a34a",yellow:"#b45309",orange:"#c2410c",red:"#dc2626",purple:"#7c3aed"};
  let sections = "";
  AREAS.forEach((area, idx)=>{
    const color = COLORS[area.color] || "#1565ff";
    let bodyHtml = "";
    if(area.kind==="machines"){
      const label = area.machineLabel || "MÁQUINA";
      area.machines.forEach(machine=>{
        const photoSubs = area.subItems.filter(sub=>sub.type!=="number");
        const numberSub = area.subItems.find(sub=>sub.type==="number");
        const photos = photoSubs.map(sub=>{
          const e = state.entries[machineEntryKey(area.id, machine, sub.key)];
          return e ? {label:sub.label, entry:e} : null;
        }).filter(Boolean);
        const numberValue = numberSub ? state.entries[machineEntryKey(area.id, machine, numberSub.key)] : null;
        const hasNumber = numberValue!=null && String(numberValue).trim()!=="";
        if(!photos.length && !hasNumber) return;
        bodyHtml += `<div style="margin:14px 0 6px;font-weight:800;font-size:13.5px;color:${color};">${escapeHtml(label+" "+machine)}</div>`;
        if(hasNumber){
          bodyHtml += `<div style="margin:6px 0;padding:8px 10px;background:#f5f7fc;border-radius:8px;font-size:13px;">📦 <strong>${escapeHtml(numberSub.label)}</strong> — ${escapeHtml(String(numberValue))} ${escapeHtml(numberSub.unit||"")}</div>`;
        }
        photos.forEach(p=> bodyHtml += renderReportPhoto(p.label, p.entry));
      });
    } else if(area.kind==="items"){
      area.items.forEach(item=>{
        const e = state.entries[itemEntryKey(area.id, item.key)];
        if(e) bodyHtml += renderReportPhoto(item.label, e);
      });
    } else if(area.kind==="text"){
      (area.checklistItems||[]).forEach(item=>{
        const val = state.entries[rotinaCheckKey(area.id, item.key)];
        const statusLabel = val==='sim' ? "✅ Realizado" : (val==='nao' ? "❌ Não realizado" : "⚠️ Não marcado");
        bodyHtml += `<div style="margin:6px 0;padding:8px 10px;background:#f5f7fc;border-radius:8px;font-size:12.5px;">
          <strong>${escapeHtml(item.label)}</strong> — ${statusLabel}<br/>
          <span style="color:#888;">Como: ${escapeHtml(item.como)} · Local: ${escapeHtml(item.local)} · Tempo: ${item.tempo} min · Frequência: ${escapeHtml(item.freq)}</span>
        </div>`;
      });
      const texto = state.entries[textEntryKey(area.id, area.textKey)] || "(não preenchido)";
      bodyHtml += `<div style="white-space:pre-wrap;font-size:13.5px;background:#f9fafc;border-radius:8px;padding:10px;margin-top:8px;">${escapeHtml(texto)}</div>`;
      const anexos = state.entries[textEntryKey(area.id, area.attachmentKey)] || [];
      anexos.forEach(a=> bodyHtml += renderReportPhoto(a.fileName, a));
    }
    if(!bodyHtml) bodyHtml = `<p style="color:#888;font-size:13px;">Sem itens.</p>`;
    sections += `
      <tr><td style="padding:18px 0 4px;">
        <div style="font-size:15px;font-weight:800;color:${color};border-bottom:2px solid ${color};padding-bottom:6px;">${idx+1}. ${escapeHtml(area.title)}</div>
        <div>${bodyHtml}</div>
      </td></tr>`;
  });

  return `<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"/>
  <title>Checklist ${escapeHtml(state.checklistId)}</title></head>
  <body style="margin:0;background:#f2f4f9;">
  <div style="font-family:Segoe UI,Roboto,Arial,sans-serif;max-width:640px;margin:0 auto;color:#1b2033;padding:16px;">
    <div style="background:#12172b;color:#fff;padding:20px;border-radius:12px 12px 0 0;">
      <div style="font-size:18px;font-weight:800;letter-spacing:.5px;"><span style="color:#ffd400;">D</span>WISE — CHECKLIST DIGITAL</div>
      <table style="margin-top:10px;font-size:13px;width:100%;">
        <tr><td style="opacity:.8;">Supervisor:</td><td style="text-align:right;font-weight:700;">${escapeHtml(state.supervisor.nome)}</td></tr>
        <tr><td style="opacity:.8;">Turno:</td><td style="text-align:right;font-weight:700;">${escapeHtml(state.supervisor.turno)}</td></tr>
        <tr><td style="opacity:.8;">Data:</td><td style="text-align:right;font-weight:700;">${escapeHtml(state.startedAt && state.startedAt.data)}</td></tr>
        <tr><td style="opacity:.8;">Horário:</td><td style="text-align:right;font-weight:700;">${escapeHtml(state.startedAt && state.startedAt.hora)}</td></tr>
        <tr><td style="opacity:.8;">Nº do Checklist:</td><td style="text-align:right;font-weight:700;">${escapeHtml(state.checklistId)}</td></tr>
      </table>
    </div>
    <table style="width:100%;background:#fff;border-radius:0 0 12px 12px;padding:0 18px;">${sections}</table>
    <p style="text-align:center;color:#9aa0b4;font-size:11px;margin-top:14px;">Gerado pelo Checklist Digital D WISE.</p>
  </div>

function renderReportPhoto(label, entry){
  if(!entry || !entry.full) return "";
  if(entry.mimeType==="application/pdf"){
    return `<div style="margin:6px 0;padding:8px 10px;background:#f5f7fc;border-radius:8px;font-size:13px;">📄 <strong>${escapeHtml(label)}</strong> — anexo em PDF (o arquivo original não pôde ser embutido como imagem; verifique diretamente no celular do supervisor).</div>`;
  }
  return `<div style="margin:10px 0;"><div style="font-size:12.5px;font-weight:700;color:#333;margin-bottom:4px;">${escapeHtml(label)}</div><img src="${entry.full}" style="max-width:260px;border-radius:8px;border:1px solid #e5e8f0;display:block;" /></div>`;
}

function downloadReport(){
  const html = buildReportHtml();
  const blob = new Blob([html], {type:"text/html"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${state.checklistId || "checklist-dwise"}.html`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

function openMailto(){
  const subject = `CHECKLIST DIGITAL D WISE — Turno ${state.supervisor.turno} — ${state.startedAt.data} — ${state.supervisor.nome}`;
  const body = [
    "CHECKLIST DIGITAL D WISE",
    "",

/* ============================================================================
   AÇÕES / EVENTOS
============================================================================ */
function goto(screen, extra){
  Object.assign(state, extra||{});
  state.screen = screen;
  render();
}

function handleAction(action, el){
  if(state.restoredDraft && action!=="new-checklist") state.restoredDraft = false;
  if(action==="start"){
    const nome = document.getElementById("nome-supervisor").value;
    state.supervisor.nome = nome;
    state.attempted = true;
    if(nome.trim().length<2 || !state.supervisor.turno){ render(); return; }
    const now = new Date();
    state.checklistId = generateChecklistId(state.supervisor.turno);
    state.startedAt = {data:formatDateBR(now), hora:formatTimeBR(now)};
    state.attempted = false;
    goto("menu");
    return;
  }
  if(action==="select-turno"){ state.supervisor.turno = el.dataset.turno; render(); return; }
  if(action==="toggle-email-config"){
    const emailInput = document.getElementById("manager-email");
    if(emailInput) state.managerEmail = emailInput.value || DEFAULT_MANAGER_EMAIL;
    const apiInput = document.getElementById("api-base-url");
    if(apiInput) state.apiBaseUrl = apiInput.value || DEFAULT_API_BASE_URL;
    state.showEmailConfig = !state.showEmailConfig;
    render();
    return;
  }
  if(action==="open-area"){ goto("area", {currentAreaId:el.dataset.area, currentMachine:null}); return; }
  if(action==="open-machine"){ goto("machine", {currentMachine:el.dataset.machine}); return; }
  if(action==="back-menu"){ state.attempted=false; goto("menu", {currentAreaId:null, currentMachine:null}); return; }
  if(action==="back-area"){ goto("area", {currentMachine:null}); return; }
  if(action==="go-conferencia"){ goto("conferencia"); return; }
  if(action==="trigger-file"){ const input=document.getElementById(el.dataset.target); if(input) input.click(); return; }
  if(action==="remove-entry"){ delete state.entries[el.dataset.key]; render(); return; }
  if(action==="set-rotina-check"){ state.entries[el.dataset.key] = el.dataset.value; render(); return; }
  if(action==="remove-rotina-attachment"){
    const area = AREAS.find(a=>a.kind==="text");
    const key = textEntryKey(area.id, area.attachmentKey);
    state.entries[key] = (state.entries[key]||[]).filter(a=>a.id!==el.dataset.id);
    render();
    return;
  }
  if(action==="submit"){
    state.attempted = true;
    const missing = collectMissing(AREAS, state.entries);
    if(missing.length>0){ render(); return; }
    state.attempted = false;
    doSubmit();
    return;
  }
  if(action==="download-report"){ downloadReport(); return; }
  if(action==="open-mailto"){ openMailto(); return; }
  if(action==="retry-submit"){ doSubmit(); return; }
  if(action==="new-checklist"){
    clearDraftInDb();
    state.supervisor = {nome:"", turno:null};
    state.checklistId = null;
    state.startedAt = null;
    state.entries = {};
    state.currentAreaId = null;
    state.currentMachine = null;
    state.attempted = false;
    state.restoredDraft = false;
    goto("login");
    return;
  }
}

async function handlePhotoInputChange(e){
  const input = e.target;
  const file = input.files && input.files[0];
  if(!file) return;
  const key = input.dataset.key;
  const kind = input.dataset.kind;
  try{
    const processed = kind==="attachment" ? await processAttachmentFile(file) : await processPhotoFile(file);
    state.entries[key] = processed;
    render();
  }catch(err){
    console.error(err);
    alert("Não foi possível carregar o arquivo. Tente novamente.");
  }
}

async function handleRotinaAttachmentChange(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const area = AREAS.find(a=>a.kind==="text");
  const key = textEntryKey(area.id, area.attachmentKey);
  try{
    const processed = await processAttachmentFile(file);
    processed.id = Date.now()+"-"+Math.random().toString(36).slice(2,7);
    state.entries[key] = [...(state.entries[key]||[]), processed];
    render();
  }catch(err){
    console.error(err);
    alert("Não foi possível carregar o arquivo. Tente novamente.");
  }
}

function wireEvents(){
  app.querySelectorAll("[data-action]").forEach(el=>{
    el.addEventListener("click", ()=>handleAction(el.dataset.action, el));
  });
  app.querySelectorAll(".photo-input").forEach(input=>{
    input.addEventListener("change", handlePhotoInputChange);
  });
  app.querySelectorAll(".rotina-attachment-input").forEach(input=>{
    input.addEventListener("change", handleRotinaAttachmentChange);
  });

  // Campos de texto contínuos: só atualizam o estado, sem re-renderizar
  // (evita perder o foco/cursor a cada tecla digitada).
  const nomeInput = document.getElementById("nome-supervisor");
  if(nomeInput) nomeInput.addEventListener("input", e=>{ state.supervisor.nome = e.target.value; });

  const emailInput = document.getElementById("manager-email");
  if(emailInput) emailInput.addEventListener("input", e=>{ state.managerEmail = e.target.value; });

  const apiInput = document.getElementById("api-base-url");
  if(apiInput) apiInput.addEventListener("input", e=>{ state.apiBaseUrl = e.target.value; });

  const rotinaTextarea = document.getElementById("rotina-texto");
  if(rotinaTextarea){
    const area = AREAS.find(a=>a.kind==="text");
    const key = textEntryKey(area.id, area.textKey);
    rotinaTextarea.addEventListener("input", e=>{ state.entries[key] = e.target.value; scheduleAutosave(); });
  }

  // Campos numéricos (ex.: quantidade produzida por máquina): idem — só
  // atualiza o estado, sem re-renderizar a cada tecla.
  app.querySelectorAll(".number-field").forEach(input=>{
    input.addEventListener("input", e=>{ state.entries[e.target.dataset.key] = e.target.value; scheduleAutosave(); });
  });
}

(async function boot(){
  const draft = await loadDraftFromDb();
  if(draft && draft.supervisor && draft.supervisor.nome && draft.checklistId){
    state.supervisor = draft.supervisor;
    state.checklistId = draft.checklistId;
    state.startedAt = draft.startedAt || null;
    state.entries = draft.entries || {};
    state.screen = "menu";
    state.restoredDraft = true;
  }
  render();
})();
</script>
